# Canonical host: https://maskarad-teatr.ru
# Keep both names in the existing Let's Encrypt certificate.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name maskarad-teatr.ru;

    ssl_certificate /etc/letsencrypt/live/maskarad-teatr.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/maskarad-teatr.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    location = /karta.html {
        return 308 https://maskarad-teatr.ru/karta-sayta$is_args$args;
    }

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.maskarad-teatr.ru;

    ssl_certificate /etc/letsencrypt/live/maskarad-teatr.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/maskarad-teatr.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = /karta.html {
        return 308 https://maskarad-teatr.ru/karta-sayta$is_args$args;
    }

    location / {
        return 308 https://maskarad-teatr.ru$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name maskarad-teatr.ru www.maskarad-teatr.ru;

    location = /karta.html {
        return 308 https://maskarad-teatr.ru/karta-sayta$is_args$args;
    }

    location / {
        return 301 https://maskarad-teatr.ru$request_uri;
    }
}
